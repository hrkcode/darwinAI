<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Darwin.AI - Seu professor de história on-line</title>
</head>
<body>
    <main>
        <img src="darwinicon.png" alt="Darwin Icon" class="darwin-icon">
        <header>
            <p class="title-label">Darwin.AI - Seu professor de história on-line</p>
            <p class="subtitle-label">Faça uma pergunta sobre história e receba uma resposta detalhada!</p> 
        </header>
        <section id="historic"></section>
        <button id="btn-clear" type="button">Limpar conversa</button>
        <form class="box-question" id="message-form">
            <input type="text" placeholder="Digite sua pergunta..." id="message-input">
            <button id="btn-submit" type="submit">Enviar</button>
        </form>
        <footer>
            Desenvolvido por Henrique Viana. 2026
        </footer>
    </main>
    <script src="main.js"></script>
</body>
</html>
